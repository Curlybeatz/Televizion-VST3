name: Build Windows VST3
on:
  push:
  workflow_dispatch:

jobs:
  build-windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Generate CMakeLists.txt
        shell: pwsh
        run: |
          @'
          cmake_minimum_required(VERSION 3.22)
          project(TelevizionPlugin VERSION 1.0.0)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          include(FetchContent)
          FetchContent_Declare(
              JUCE
              GIT_REPOSITORY https://github.com/juce-framework/JUCE.git
              GIT_TAG        7.0.12
          )
          FetchContent_MakeAvailable(JUCE)
          juce_add_plugin(Televizion
              COMPANY_NAME "ParsAcoustic"
              IS_SYNTH FALSE
              NEEDS_MIDI_INPUT FALSE
              NEEDS_MIDI_OUTPUT FALSE
              IS_MIDI_EFFECT FALSE
              EDITOR_WANTS_KEYBOARD_FOCUS FALSE
              COPY_PLUGIN_AFTER_BUILD FALSE
              PLUGIN_MANUFACTURER_CODE PrAc
              PLUGIN_CODE Tlvz
              FORMATS VST3 Standalone
              PRODUCT_NAME "Televizion"
          )
          juce_generate_juce_header(Televizion)
          target_sources(Televizion PRIVATE TelevizionVST3.cpp)
          target_compile_definitions(Televizion PUBLIC
              JUCE_WEB_BROWSER=0
              JUCE_USE_CURL=0
              JUCE_VST3_CAN_REPLACE_VST2=0
          )
          target_link_libraries(Televizion
              PRIVATE juce::juce_audio_utils juce::juce_dsp
              PUBLIC juce::juce_recommended_config_flags juce::juce_recommended_lto_flags juce::juce_recommended_warning_flags
          )
          '@ | Set-Content -Path CMakeLists.txt -Encoding UTF8

      - name: Configure CMake (Visual Studio 2022 x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compile VST3 and Standalone
        run: cmake --build build --config Release

      - name: Upload Windows VST3 & Standalone Package
        uses: actions/upload-artifact@v4
        with:
          name: Televizion-Windows-VST3
          path: |
            build/Televizion_artefacts/Release/VST3/Televizion.vst3
            build/Televizion_artefacts/Release/Standalone/Televizion.exe
