name: Build Windows VST3
on:
  push:
  workflow_dispatch:

jobs:
  build-windows-vst3:
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure CMake (Visual Studio 2022 x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compile VST3 and Standalone
        run: cmake --build build --config Release

      - name: Upload Windows VST3 & Standalone Package
        uses: actions/upload-artifact@v4
        with:
          name: Televizion-Windows-VST3
          path: |
            build/Televizion_artefacts/Release/VST3/Televizion.vst3
            build/Televizion_artefacts/Release/Standalone/Televizion.exe
